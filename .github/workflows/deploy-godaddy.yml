name: Build website for GoDaddy

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/neutaware-site/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-godaddy.yml'
  workflow_dispatch:

concurrency:
  group: build-godaddy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @workspace/neutaware-site...

      - name: Build website
        run: pnpm --filter @workspace/neutaware-site run build
        env:
          NODE_ENV: production
          BASE_PATH: /

      # Download this zip from the run page and upload it to public_html
      # with GoDaddy cPanel File Manager, then Extract it there.
      - name: Package site for GoDaddy upload
        uses: actions/upload-artifact@v4
        with:
          name: neutaware-site
          path: artifacts/neutaware-site/dist/public/
          include-hidden-files: true
          retention-days: 30
